<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/" />
    <link rel="stylesheet" href="src/view/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rock-paper-scissors-game</title>
  </head>
  <body>
    <!-- MAIN -->
    <main>
      <h1 class="text-center font-bold text-4xl">Rock, Paper, Scissors Game</h1>
      <div class="h-screen flex items-center">
        <!-- left hand -->
        <div class="flex flex-col gap-4 w-2/4 md:ml-12">
          <p class="text-center text-xl font-bold">Player</p>
          <img
            class="default-img mx-auto object-contain w-2/4"
            src="./src/assets/default.jpeg"
            alt="Default picture for the rock-paper-scissors-game"
          />
          <div
            class="flex flex-col gap-4 justify-center md:flex-row md:justify-around"
          >
            <!-- rock button -->
            <button
              class="flex flex-col items-center gap-2"
              id="user-rock-button"
            >
              <span class="text-center">Rock</span>
              <svg
                class="lg:cursor-pointer"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 100 100"
                width="50"
                height="50"
              >
                <circle cx="50" cy="50" r="46" fill="#ea62e1" />
                <g
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M 36 68 L 36 42 C 36 37, 42 37, 42 42 L 42 56 
             M 42 50 C 42 46, 49 46, 49 52 L 49 58 
             M 49 50 C 49 46, 56 46, 56 52 L 56 68 
             M 56 48 L 56 42 C 56 37, 62 37, 62 42 L 62 68 
             M 36 58 C 30 60, 32 72, 42 72 L 58 72 C 66 72, 66 62, 62 58"
                  />
                  <path d="M 42 56 C 42 62, 54 62, 56 56" />
                </g>
              </svg>
            </button>
            <!-- paper button -->
            <button
              class="flex flex-col items-center gap-2"
              id="user-paper-button"
            >
              <span class="text-center">Paper</span>
              <svg
                class="lg:cursor-pointer"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 100 100"
                width="50"
                height="50"
              >
                <circle cx="50" cy="50" r="46" fill="#e6ea2c" />
                <g
                  fill="none"
                  stroke="#333333"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect
                    x="33"
                    y="27"
                    width="34"
                    height="46"
                    rx="1"
                    fill="#ffffff"
                  />
                  <path
                    d="M 33 34 C 38 31, 62 31, 67 34 
             M 33 66 C 38 69, 62 69, 67 66"
                  />
                </g>
              </svg>
            </button>
            <!-- scissors button -->
            <button
              class="flex flex-col items-center gap-2"
              id="user-scissors-button"
            >
              <span class="text-center">Scissors</span>
              <svg
                class="lg:cursor-pointer"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 100 100"
                width="50"
                height="50"
              >
                <circle cx="50" cy="50" r="46" fill="#4fe3f4" />
                <g
                  fill="none"
                  stroke="#333333"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M 35 33 L 67 67 M 35 67 L 67 33" />
                  <circle cx="33" cy="33" r="6" />
                  <circle cx="33" cy="67" r="6" />
                  <circle cx="50" cy="50" r="1.5" fill="#333333" />
                </g>
              </svg>
            </button>
          </div>
        </div>
        <div class="flex flex-col gap-4 items-center w-full">
          <p class="text-4xl">VS</p>
          <p class="text-4xl font-bold text-center">YOU WIN</p>
          <button class="border text-xl p-2">Clear</button>
        </div>

        <!-- right hand -->
        <div class="flex flex-col gap-4 w-2/4 md:mr-12">
          <p class="text-center text-xl font-bold">Computer</p>
          <img
            class="mx-auto object-contain w-2/4 -scale-x-100"
            src="./src/assets/default.jpeg"
            alt="Default picture for the rock-paper-scissors-game"
          />
          <div
            class="flex flex-col gap-4 justify-center md:flex-row md:justify-around"
          >
            <!-- rock button -->
            <button class="flex flex-col items-center gap-2">
              <span class="text-center">Rock</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 100 100"
                width="50"
                height="50"
              >
                <circle cx="50" cy="50" r="46" fill="#ea62e1" />
                <g
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M 36 68 L 36 42 C 36 37, 42 37, 42 42 L 42 56 
             M 42 50 C 42 46, 49 46, 49 52 L 49 58 
             M 49 50 C 49 46, 56 46, 56 52 L 56 68 
             M 56 48 L 56 42 C 56 37, 62 37, 62 42 L 62 68 
             M 36 58 C 30 60, 32 72, 42 72 L 58 72 C 66 72, 66 62, 62 58"
                  />
                  <path d="M 42 56 C 42 62, 54 62, 56 56" />
                </g>
              </svg>
            </button>
            <!-- paper button -->
            <button class="flex flex-col items-center gap-2">
              <span class="text-center">Paper</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 100 100"
                width="50"
                height="50"
              >
                <circle cx="50" cy="50" r="46" fill="#e6ea2c" />
                <g
                  fill="none"
                  stroke="#333333"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect
                    x="33"
                    y="27"
                    width="34"
                    height="46"
                    rx="1"
                    fill="#ffffff"
                  />
                  <path
                    d="M 33 34 C 38 31, 62 31, 67 34 
             M 33 66 C 38 69, 62 69, 67 66"
                  />
                </g>
              </svg>
            </button>
            <!-- scissors button -->
            <button class="flex flex-col items-center gap-2">
              <span class="text-center">Scissors</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 100 100"
                width="50"
                height="50"
              >
                <circle cx="50" cy="50" r="46" fill="#4fe3f4" />
                <g
                  fill="none"
                  stroke="#333333"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M 35 33 L 67 67 M 35 67 L 67 33" />
                  <circle cx="33" cy="33" r="6" />
                  <circle cx="33" cy="67" r="6" />
                  <circle cx="50" cy="50" r="1.5" fill="#333333" />
                </g>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/controller/main.js"></script>
  </body>
</html>
